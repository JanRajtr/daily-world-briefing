name: Denní přehled trhů a zdravého života

on:
  schedule:
    # 06:00 UTC = 07:00 CET / 08:00 CEST. GitHub schedules use UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional report date (YYYY-MM-DD); blank means today in Europe/Prague"
        required: false
        type: string
      notify_instapaper:
        description: "Send the published URL to Instapaper"
        required: true
        default: false
        type: boolean

concurrency:
  group: daily-world-briefing-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      report_date: ${{ steps.date.outputs.report_date }}
      should_notify: ${{ steps.date.outputs.should_notify }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Select report date and notification mode
        id: date
        env:
          MANUAL_DATE: ${{ inputs.report_date }}
          MANUAL_NOTIFY: ${{ inputs.notify_instapaper }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -n "$MANUAL_DATE" ]]; then
            REPORT_DATE="$MANUAL_DATE"
          else
            REPORT_DATE="$(TZ=Europe/Prague date +%F)"
          fi
          REPORT_DATE="$REPORT_DATE" python -c 'import os; from datetime import date; date.fromisoformat(os.environ["REPORT_DATE"])'
          if [[ "$EVENT_NAME" == "schedule" ]]; then SHOULD_NOTIFY=true; else SHOULD_NOTIFY="${MANUAL_NOTIFY:-false}"; fi
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "should_notify=$SHOULD_NOTIFY" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s news/tests -v

      - name: Generate Czech market component
        run: python scripts/generate_report.py --profile cs-buddhist --date "${{ steps.date.outputs.report_date }}" --output work/cs-market

      - name: Generate Czech world-news component
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
        run: python news/scripts/generate_report.py --profile cs-buddhist --date "${{ steps.date.outputs.report_date }}" --output work/cs-news

      - name: Leave Groq token window before Czech web research
        run: sleep 65

      - name: Merge Czech daily report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_WEB_MODEL: groq/compound
          GROQ_REFLECTION_MODEL: groq/compound-mini
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/merge_reports.py --profile cs-buddhist --market work/cs-market --news work/cs-news --output site

      - name: Leave Groq token window before Indonesian profile
        run: sleep 65

      - name: Generate Indonesian market component
        run: python scripts/generate_report.py --profile id-islamic --date "${{ steps.date.outputs.report_date }}" --output work/id-market

      - name: Generate Indonesian world-news component
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
        run: python news/scripts/generate_report.py --profile id-islamic --date "${{ steps.date.outputs.report_date }}" --output work/id-news

      - name: Leave Groq token window before Indonesian web research
        run: sleep 65

      - name: Merge Indonesian daily report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_WEB_MODEL: groq/compound
          GROQ_REFLECTION_MODEL: groq/compound-mini
        run: python scripts/merge_reports.py --profile id-islamic --market work/id-market --news work/id-news --flight-fixture site/report.json --output site/id

      - name: Commit daily report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "Archive already contains this exact report."
          else
            git commit -m "briefing: ${{ steps.date.outputs.report_date }}"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for the unique report URL
        if: needs.build.outputs.should_notify == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_DATE: ${{ needs.build.outputs.report_date }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPORT_URL="${PAGE_URL%/}/index.html?run=${RUN_ID}"
          ID_REPORT_URL="${PAGE_URL%/}/id/index.html?run=${RUN_ID}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$REPORT_URL" >/dev/null && curl --fail --silent --show-error --location "$ID_REPORT_URL" >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "Report URL was not reachable after deployment: $REPORT_URL" >&2
          exit 1

      - name: Send report to Instapaper accounts
        if: needs.build.outputs.should_notify == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_DATE: ${{ needs.build.outputs.report_date }}
          RUN_ID: ${{ github.run_id }}
          INSTAPAPER_USERNAME: ${{ secrets.INSTAPAPER_USERNAME }}
          INSTAPAPER_PASSWORD: ${{ secrets.INSTAPAPER_PASSWORD }}
          INSTAPAPER_USERNAME_SECONDARY: ${{ secrets.INSTAPAPER_USERNAME_SECONDARY }}
          INSTAPAPER_PASSWORD_SECONDARY: ${{ secrets.INSTAPAPER_PASSWORD_SECONDARY }}
        run: |
          test -n "$INSTAPAPER_USERNAME" || { echo "Missing INSTAPAPER_USERNAME secret" >&2; exit 1; }
          REPORT_URL="${PAGE_URL%/}/index.html?run=${RUN_ID}"
          send_to_instapaper() {
            local account_label="$1"
            local username="$2"
            local password="$3"
            local report_url="$4"
            local report_title="$5"
            local response_file="/tmp/instapaper-${account_label}-response.txt"
            local status
            status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --user "$username:$password" \
              --data-urlencode "url=$report_url" \
              --data-urlencode "title=$report_title" \
              https://www.instapaper.com/api/add)
            if [[ "$status" != "201" ]]; then
              echo "Instapaper ${account_label} account returned HTTP $status" >&2
              sed 's/./*/g' "$response_file" >&2
              return 1
            fi
            echo "Report added to the ${account_label} Instapaper account."
          }

          send_to_instapaper primary "$INSTAPAPER_USERNAME" "$INSTAPAPER_PASSWORD" "$REPORT_URL" "Denní přehled trhů a zdravého života — $REPORT_DATE"
          if [[ -n "$INSTAPAPER_USERNAME_SECONDARY" ]]; then
            send_to_instapaper secondary "$INSTAPAPER_USERNAME_SECONDARY" "$INSTAPAPER_PASSWORD_SECONDARY" "${PAGE_URL%/}/id/index.html?run=${RUN_ID}" "Ringkasan harian pasar dan hidup sehat — $REPORT_DATE"
          else
            echo "Secondary Instapaper account is not configured; skipping the Indonesian report."
          fi
